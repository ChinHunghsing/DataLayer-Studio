<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DataLayer Studio</title>
  <desc id="desc">A running video preview with synchronized FIT telemetry, live gauges, and a multitrack timeline.</desc>

  <defs>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163846"/>
      <stop offset="1" stop-color="#0A202A"/>
    </linearGradient>
    <clipPath id="preview-clip">
      <rect x="708" y="60" width="422" height="224" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#061820"/>

  <g id="title-block" transform="translate(64 58)">
    <text fill="#58D9FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.5">RUNNING TELEMETRY → VIDEO</text>
    <text y="78" fill="#F2FBFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="-2.6">DataLayer</text>
    <text y="142" fill="#F2FBFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="-2.6">Studio</text>
    <text y="194" fill="#A9C1CB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">Turn FIT data into synchronized video overlays.</text>

    <g transform="translate(0 238)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
      <rect width="148" height="38" rx="19" fill="#0D2934" stroke="#245267"/>
      <text x="74" y="24" fill="#C5E4EE" text-anchor="middle">TIMELINE SYNC</text>
      <rect x="160" width="126" height="38" rx="19" fill="#0D2934" stroke="#245267"/>
      <text x="223" y="24" fill="#C5E4EE" text-anchor="middle">LIVE GAUGES</text>
      <rect x="298" width="130" height="38" rx="19" fill="#0D2934" stroke="#245267"/>
      <text x="363" y="24" fill="#C5E4EE" text-anchor="middle">ALPHA EXPORT</text>
    </g>
  </g>

  <g id="editor-preview">
    <rect x="684" y="36" width="470" height="348" rx="22" fill="#0C242E" stroke="#275366"/>
    <circle cx="712" cy="58" r="5" fill="#FF6B6B"/>
    <circle cx="730" cy="58" r="5" fill="#FFD15C"/>
    <circle cx="748" cy="58" r="5" fill="#6CDD8B"/>
    <text x="1124" y="63" fill="#6F929F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">00:49:17</text>

    <rect x="708" y="76" width="422" height="208" rx="16" fill="url(#video)"/>
    <g clip-path="url(#preview-clip)">
      <path d="M680 268 C760 208 802 230 858 168 C914 107 996 132 1168 82" fill="none" stroke="#2F667A" stroke-width="44" opacity=".35"/>
      <path d="M680 268 C760 208 802 230 858 168 C914 107 996 132 1168 82" fill="none" stroke="#58D9FF" stroke-width="4"/>
      <circle cx="858" cy="168" r="8" fill="#B7F76A" stroke="#061820" stroke-width="4"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g transform="translate(726 96)">
        <rect width="98" height="52" rx="10" fill="#061820" opacity=".9"/>
        <text x="12" y="18" fill="#7FA0AC" font-size="10" font-weight="700">PACE</text>
        <text x="12" y="40" fill="#F2FBFF" font-size="19" font-weight="700">4:36</text>
        <text x="64" y="40" fill="#7FA0AC" font-size="10">/KM</text>
      </g>
      <g transform="translate(726 156)">
        <rect width="98" height="52" rx="10" fill="#061820" opacity=".9"/>
        <text x="12" y="18" fill="#7FA0AC" font-size="10" font-weight="700">HEART RATE</text>
        <text x="12" y="40" fill="#FF7E72" font-size="19" font-weight="700">148</text>
        <text x="50" y="40" fill="#7FA0AC" font-size="10">BPM</text>
      </g>
      <g transform="translate(1014 214)">
        <rect width="98" height="52" rx="10" fill="#061820" opacity=".9"/>
        <text x="12" y="18" fill="#7FA0AC" font-size="10" font-weight="700">DISTANCE</text>
        <text x="12" y="40" fill="#B7F76A" font-size="19" font-weight="700">10.2</text>
        <text x="61" y="40" fill="#7FA0AC" font-size="10">KM</text>
      </g>
    </g>

    <g id="timeline" transform="translate(708 304)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="12" fill="#72919D" font-size="10">VIDEO</text>
      <rect x="52" width="350" height="18" rx="5" fill="#183845"/>
      <rect x="52" width="252" height="18" rx="5" fill="#2F7188"/>
      <path d="M62 9h232" stroke="#79C8E1" stroke-width="2" stroke-dasharray="3 5"/>
      <text x="0" y="42" fill="#72919D" font-size="10">FIT</text>
      <rect x="52" y="30" width="350" height="18" rx="5" fill="#203D32"/>
      <rect x="84" y="30" width="292" height="18" rx="5" fill="#42785B"/>
      <path d="M98 39h260" stroke="#B7F76A" stroke-width="2" stroke-dasharray="3 5"/>
      <path d="M190 -7v66" stroke="#58D9FF" stroke-width="2"/>
      <path d="M184 -7h12l-6 7z" fill="#58D9FF"/>
    </g>
  </g>

  <path d="M542 86 C594 86 605 126 654 126" fill="none" stroke="#1D4657" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="542" cy="86" r="4" fill="#58D9FF"/>
  <circle cx="654" cy="126" r="4" fill="#B7F76A"/>
</svg>
