name: Feature request
description: Suggest an improvement for the app, CLI, renderer, or FIT parsing.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private videos, FIT files, GPS traces, or credentials.
        Describe workflows with sanitized examples whenever possible.
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: I removed or redacted private videos, FIT files, GPS traces, credentials, and local paths from public attachments.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: How would someone use this in the GUI or CLI?
      placeholder: |
        1. Import ...
        2. Set ...
        3. Export ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GUI
        - CLI
        - FIT parsing
        - Overlay rendering
        - Export
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workaround, external tool, or simpler behavior that would be enough.
