name: Documentation
description: Report unclear, missing, or outdated documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private videos, FIT files, GPS traces, credentials, or local paths.
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: I removed private videos, FIT files, GPS traces, credentials, and local paths from this issue.
          required: true
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Link the page or name the section that needs work.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: Optional wording or structure that would make it clearer.
