name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish release zip
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Verify source-available readiness
        run: scripts/verify_source_available_readiness.sh

      - name: Run tests
        run: swift test

      - name: Build release products
        run: |
          swift build -c release --product overlay
          swift build -c release --product datalayer-studio

      - name: Build app bundle
        env:
          APP_VERSION: ${{ github.ref_name }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export APP_VERSION="${APP_VERSION#v}"
          scripts/build_app_bundle.sh

      - name: Verify app bundle
        run: scripts/verify_app_bundle.sh

      - name: Install asc
        run: |
          if brew tap | grep -qx aws/tap; then
            brew untap aws/tap
          fi
          command -v asc >/dev/null || brew install asc

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERTIFICATE_BASE64:-}" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi

          keychain_password="${KEYCHAIN_PASSWORD:-ci-keychain}"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          p12_path="$RUNNER_TEMP/developer-id.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" -k "$keychain_path" -P "${CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Sign, notarize, and package app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_API_ISSUER_ID: ${{ secrets.APP_STORE_API_ISSUER_ID }}
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          app_path=".build/DataLayer Studio.app"
          zip_name="DataLayer-Studio-${tag}-macOS-arm64.zip"

          test -d "$app_path"
          scripts/sign_notarize_app_bundle.sh "$app_path" "$zip_name"

          {
            echo "ZIP_NAME=$zip_name"
            echo "SHA_NAME=$zip_name.sha256"
          } >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="DataLayer Studio ${tag}"
          free_note='This is the free version: exports are limited to 1080p and include a "Made with DataLayer Studio" watermark. Buy the full version on the Mac App Store for full-resolution, watermark-free exports: https://apps.apple.com/cn/app/datalayer-studio/id6782545770'
          notes="$(printf '%s\n\n%s' "Automated macOS arm64 build for ${tag}." "$free_note")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP_NAME" "$SHA_NAME" --clobber
          else
            gh release create "$tag" "$ZIP_NAME" "$SHA_NAME" \
              --title "$title" \
              --notes "$notes"
          fi
