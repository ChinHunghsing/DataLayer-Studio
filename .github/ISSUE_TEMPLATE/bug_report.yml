name: Bug report
description: Report a reproducible problem in DataLayer Studio.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private videos, FIT files, GPS traces, or credentials.
        Use sanitized fixtures whenever possible.
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: I removed or redacted private videos, FIT files, GPS traces, credentials, and local paths from public attachments.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: v0.1.0 or commit SHA
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
  - type: textarea
    id: verification
    attributes:
      label: Verification notes
      description: Commands run, screenshots, sanitized sample details, or logs.
